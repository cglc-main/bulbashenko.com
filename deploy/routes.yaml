# Routes (Gateway API) on the cluster's shared Gateway `traefik/main`, which terminates TLS.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: site
spec:
  parentRefs:
    - { name: main, namespace: traefik }
  hostnames: [bulbashenko.com]
  rules:
    - backendRefs: [{ name: site, port: 3000 }]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: www-to-apex
spec:
  parentRefs:
    - { name: main, namespace: traefik }
  hostnames: [www.bulbashenko.com]
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect: { hostname: bulbashenko.com, statusCode: 301 }
