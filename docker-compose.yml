# Local development and the CI media test: Postgres for the app, and a Nextcloud with the Team folder the site
# reads its gallery and files from (set up by scripts/nextcloud-dev-setup.sh). Production runs both in the cluster
# (cglc-main/infra).
services:
  postgres:
    image: postgres:18.4-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bulbashenko
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql

  # Same major as production. SQLite is enough for a dev copy; the site only talks WebDAV and the preview API.
  nextcloud:
    image: nextcloud:35-apache@sha256:04f8aab430ca662b0e59fcbf14ebe877fae8490947b93c91cfa9a9d0db16d4ed
    restart: unless-stopped
    environment:
      SQLITE_DATABASE: nextcloud
      NEXTCLOUD_ADMIN_USER: admin
      NEXTCLOUD_ADMIN_PASSWORD: admin-dev-password
      NEXTCLOUD_TRUSTED_DOMAINS: localhost nextcloud
    ports:
      - "8081:80"
    volumes:
      - nextcloud:/var/www/html

volumes:
  pgdata:
  nextcloud:
