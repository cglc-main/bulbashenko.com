# The PR title becomes the squashed commit that semantic-release reads (cglc-main/.github, pr-title.yml).
name: pr-title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  title:
    uses: cglc-main/.github/.github/workflows/pr-title.yml@313676b08df84a35e86d9600c97e128897853a0e # main
